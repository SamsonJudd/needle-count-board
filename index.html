<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Needle Count Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eceff3;--panel:#ffffff;--line:#d8dde4;--line2:#bfc6d0;
  --text:#15181d;--muted:#566070;--faint:#8b929d;
  --accent:#1f5fcc;--accent-d:#174a9f;--accent-bg:#e6eefb;--accent-line:#c3d4f3;--accent-text:#174a9f;
  --warn-bg:#fdf2d6;--warn-line:#e2ad3b;--warn-text:#6e4300;
  --ok-bg:#e2f3e5;--ok-line:#79c088;--ok-text:#1c6631;
  --bad-bg:#fce7e7;--bad-line:#e69a9a;--bad-text:#951b1b;
  --int:#c2410c;--int-text:#9a3412;
  --d-bg:#0f1721;--d-line:#27364a;--d-text:#f1f5f9;--d-muted:#9db0c6;--d-amber:#f6b93b;--d-amber-bg:#2b2110;--d-amber-text:#ffe3a3;--d-green:#57d18c;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-size:26px;line-height:1.2;margin:0 0 10px;font-weight:650}
h2{font-size:18px;margin:0 0 6px;font-weight:650}
p{margin:0 0 10px}
button{font:inherit;font-weight:500;cursor:pointer;border-radius:8px;border:1px solid var(--line2);background:#fff;color:var(--text);padding:8px 14px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .12s,border-color .12s}
button:hover{background:#f3f5f8}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-d);border-color:var(--accent-d)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{background:#e9edf2;color:var(--text)}
button.big{font-size:17px;min-height:48px;padding:10px 26px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #9bbcf2;outline-offset:2px}
input[type=text],input[type=number]{font:inherit;padding:8px 10px;border:1px solid var(--line2);border-radius:8px;min-height:42px;width:100%;background:#fff;color:var(--text)}
input[type=number]{font-size:22px;font-weight:600;max-width:160px}
.muted{color:var(--muted)}
.small{font-size:13px}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 20px;background:#1d2430;color:#e9edf3;font-size:14px;min-height:44px}
.topbar b{color:#fff;font-weight:600}
.tb-role{display:inline-flex;align-items:center;gap:8px}
.tb-dot{width:8px;height:8px;border-radius:50%;background:#5bd08a;display:inline-block}

.work{display:grid;grid-template-columns:minmax(330px,390px) minmax(0,1fr);gap:16px;padding:14px 18px;max-width:1500px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 9px;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:650;min-height:20px}
.ph span{text-transform:none;letter-spacing:0;font-weight:400;font-size:13px}
.ph button{text-transform:none;letter-spacing:0;font-size:13px;min-height:28px;padding:2px 10px;margin:-4px -6px -4px 0}

.rq{background:var(--accent-bg);border:1px solid var(--accent-line);border-radius:10px;padding:10px 13px}
.rq.count{background:#fff4ec;border-color:#f4c9a8}
.rq-who{font-size:13px;font-weight:650;color:var(--accent-text)}
.rq.count .rq-who{color:var(--int-text)}
.rq-text{font-size:19px;font-weight:550;margin:4px 0 8px;line-height:1.3}
.rq-items{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px}
.rq-items li{display:flex;align-items:center;gap:6px}
.rq-items .box{width:16px;height:16px;border:1.5px solid #7f9cd3;border-radius:4px;display:inline-block;flex:none}
.rq-items li.got{color:var(--ok-text);font-weight:550}
.rq-hint{font-size:14px;color:var(--int-text);margin:0}
.rq-wait{color:var(--muted);margin:0;padding:6px 0}
.rq-done{margin-top:10px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.rq-done span{display:inline-flex;align-items:center;gap:4px}

.hand-row{display:flex;gap:12px;align-items:stretch}
.hand-empty{color:var(--muted);margin:0;padding:10px 0}
.hand-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}

.cart{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pk{display:flex;align-items:stretch;justify-content:flex-start;gap:0;padding:0;text-align:left;min-height:50px;overflow:hidden;border-radius:8px;border:1px solid var(--line2);background:#fbfaf7;width:100%}
.pk:hover{background:#f4f2ec;border-color:#a9b1bc}
.pk:disabled{opacity:.42;cursor:default;background:#fbfaf7;border-color:var(--line2)}
@keyframes askpulse{50%{box-shadow:0 0 0 6px rgba(42,99,214,.18)}}
.ask-list{display:flex;flex-direction:column;gap:8px;margin:6px 0 2px}
.askpk{display:flex;align-items:center;justify-content:flex-start;gap:11px;width:100%;min-height:56px;padding:0 14px 0 0;border:2px solid var(--accent);border-radius:10px;background:#fff;text-align:left;overflow:hidden;animation:askpulse 1.6s ease-in-out infinite}
.askpk:hover{background:#eef4ff}
.askpk .pk-band{align-self:stretch;width:9px}
.askpk .pk-name{font-size:16px}
.ask-body{display:flex;flex-direction:column;align-items:flex-start;gap:4px;flex:1;min-width:0;padding:8px 0}
.ask-go{margin-left:auto;font-weight:650;font-size:14px;color:var(--accent-text);white-space:nowrap}
.askpk.got{border:1px solid #bfdcc6;background:#f1f8f2;color:var(--ok-text);padding:0 14px;animation:none}
.askpk.got .ask-go{color:var(--ok-text)}
.npick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 4px}
.npick button{flex-direction:column;align-items:flex-start;gap:3px;padding:14px 16px;min-height:74px;text-align:left}
.npick button b{font-size:19px}
.npick button span{font-size:13px;color:var(--muted);font-weight:400}
.npick button.cur{border-color:var(--accent)}
.look{display:flex;gap:14px;align-items:center;margin:10px 0 4px}
.look .snap{flex:none;border-radius:8px;overflow:hidden;line-height:0}
.look p{margin:0}
.coach{display:flex;gap:9px;align-items:flex-start;background:#fff8dc;border:1px solid #e6cf7a;color:#4d3d00;border-radius:10px;padding:10px 13px;font-size:15px;line-height:1.35}
.coach .ico{flex:none;margin-top:2px}
.rq .primary{width:100%}
.row.nt{grid-template-columns:minmax(0,1fr) auto 34px}
.r-flag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:700;color:#7a4b00;background:#fde9b8;border-radius:4px;padding:1px 7px;vertical-align:1px}
.pk-band{width:8px;flex:none}
.pk-body{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:7px 10px;flex:1;min-width:0}
.pk-top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.pk-name{font-weight:650;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pk-da{font-size:11px;font-weight:700;color:#7a2e0e;background:#fbe0cf;border-radius:4px;padding:1px 6px;white-space:nowrap}
.pk-bot{display:flex;align-items:center;gap:7px;min-width:0}
.pk-meta{font-size:12px;color:var(--muted);white-space:nowrap}
.barcode{color:#2a2f36;flex:none}
.pk.big{flex:1;min-height:62px;cursor:default;background:#fbfaf7}
.pk.big:hover{background:#fbfaf7;border-color:var(--line2)}
.pk.big .pk-name{font-size:17px}
.hand-actions button,.b-actions button,.b-tools button,.lk button,.res-actions button{white-space:nowrap}

.board{padding:0;overflow:hidden}
.b-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.b-room{font-weight:650;color:var(--text);font-size:15px}
.b-head .ico{vertical-align:-3px;margin-right:4px}
.b-mode{margin-left:auto;font-size:12px;font-weight:650;border-radius:999px;padding:4px 11px;background:var(--accent-bg);color:var(--accent-text);display:inline-flex;gap:6px;align-items:center}
.b-tools{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
.b-main{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;padding:14px 16px 16px}
.big-label{font-size:15px;color:var(--muted);font-weight:550}
.big-num{font-size:96px;font-weight:650;line-height:1;letter-spacing:-.03em;margin:4px 0 4px;font-variant-numeric:tabular-nums}
.big-sub{font-size:15px;color:var(--muted);margin-bottom:10px}
.pend-note{display:flex;gap:8px;align-items:center;background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-text);border-radius:8px;padding:8px 11px;font-weight:650;font-size:14px;margin:0 0 10px}
.pend-note .ico{flex:none}
.mini{font-size:13px;margin-top:8px}
.log-title{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:550}
.log-title.wait{color:#f6b93b;font-weight:650}
.handoff-note{display:flex;gap:8px;align-items:flex-start;background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent-text);border-radius:8px;padding:9px 11px;font-size:14px;margin:0 0 8px}
.handoff-note .ico{flex:none;margin-top:2px}
.row{display:grid;grid-template-columns:46px minmax(0,1fr) auto 34px;align-items:center;gap:10px;padding:8px 8px;border-bottom:1px solid var(--line);font-size:15px}
.row.since{box-shadow:inset 3px 0 0 #7f9cd3}
.rowbtn{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;min-height:0;text-align:left;font-weight:400;justify-content:stretch;color:var(--text)}
.rowbtn:hover{background:#f1f5fc}
.rowbtn:active{transform:none}
.log-hint{font-size:12px;color:var(--faint);margin:8px 0 0}
.r-time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.r-name{font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-src{font-size:12px;color:var(--muted);white-space:nowrap}
.r-n{font-weight:700;text-align:right;font-size:17px;font-variant-numeric:tabular-nums}
.row.new{animation:rowfade 60s linear forwards}
@keyframes rowfade{0%,88%{background:#e6eefb}100%{background:transparent}}
.newchip{font-size:10.5px;font-weight:700;color:var(--accent-text);background:#d4e2fa;border-radius:4px;padding:1px 6px;margin-left:8px;vertical-align:1px;animation:chipfade 60s linear forwards}
@keyframes chipfade{0%,88%{opacity:1}100%{opacity:0}}
.log-empty{color:var(--muted);padding:10px 4px;margin:0}
.pend{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:10px;margin-bottom:8px;color:var(--warn-text)}
.pend-top{display:flex;gap:12px;align-items:flex-start}
.snap{flex:none;width:132px;height:88px;border-radius:6px;overflow:hidden;border:1px solid #d8c9a3;background:#fff;line-height:0}
.pend-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pend-text b{font-size:16px;font-weight:650;color:#4a2d00}
.pend-text span{font-size:13px}
.pend-tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pend-tag .w{text-transform:none;letter-spacing:0;font-weight:500;opacity:.85}
.pend-n{font-size:26px;font-weight:700;color:#4a2d00;font-variant-numeric:tabular-nums}
.pend-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;margin-top:10px}
.pend-actions.one{grid-template-columns:1fr}
.pend-actions button{background:#fff}
.conf{display:inline-flex;align-items:center;gap:7px}
.conf-bars{display:inline-flex;gap:2px;align-items:flex-end;flex:none}
.conf-bars i{width:4px;background:currentColor;opacity:.3;border-radius:1px;display:inline-block}
.conf-bars i.on{opacity:1}
.b-actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fafbfc}

.board.dark{background:var(--d-bg);border-color:#0b1118;color:var(--d-text)}
.dark .b-head{border-bottom-color:var(--d-line);color:var(--d-muted)}
.dark .b-room{color:#fff}
.b-cam{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:650;border-radius:999px;padding:4px 11px;background:#163626;color:#8fe3b1}
.b-cam i{width:8px;height:8px;border-radius:50%;background:var(--d-green);display:inline-block}
.dark .b-tools{background:#131d2a;border-bottom-color:var(--d-line)}
.dark .b-tools button{background:#1c2a3b;border-color:#3a4d66;color:#e8eef5}
.dark .b-tools button:hover{background:#26384e}
.dark .big-label,.dark .big-sub,.dark .log-title,.dark .log-hint,.dark .log-empty,.dark .mini{color:var(--d-muted)}
.dark .big-num{color:#fff}
.dark .pend-note{background:var(--d-amber-bg);border-color:var(--d-amber);color:var(--d-amber-text)}
.dark .row{border-bottom-color:#243245}
.dark .r-time,.dark .r-src{color:var(--d-muted)}
.dark .rowbtn{color:var(--d-text);border-bottom-color:#243245}
.dark .rowbtn:hover{background:#1a2839}
.dark .row.new{animation-name:rowfadeD}
@keyframes rowfadeD{0%,88%{background:#1b3350}100%{background:transparent}}
.dark .newchip{background:#24507e;color:#d3e7ff}
.dark .pend{background:var(--d-amber-bg);border:1.5px solid var(--d-amber);color:var(--d-amber-text)}
.dark .pend.late{animation:late 1.3s ease-in-out infinite}
@keyframes late{50%{box-shadow:0 0 0 4px rgba(246,185,59,.35)}}
.dark .pend-text b,.dark .pend-n{color:#fff}
.dark .snap{border-color:#5a4a22;background:#1f4e63}
.dark .pend-actions button{background:transparent;border-color:#8a763f;color:var(--d-amber-text)}
.dark .pend-actions button:hover{background:#3a2d14}
.dark .pend-actions button.go{background:var(--d-amber);border-color:var(--d-amber);color:#1b1300;font-weight:650}
.dark .pend-actions button.go:hover{background:#ffcb5c}
.dark .handoff-note{background:#14283f;border-color:#2f5a8c;color:#cfe3ff}
.dark button:focus-visible{outline-color:#9bbcf2}

.feed{border:1px solid var(--d-line);border-radius:8px;overflow:hidden;background:#0a1118}
.feed-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--d-muted);padding:5px 9px}
.feed-head .ico{vertical-align:-2px;margin-right:5px}
.feed-live{display:inline-flex;align-items:center;gap:6px;color:#ffb4b4;font-weight:650}
.feed-live i{width:7px;height:7px;border-radius:50%;background:#ff6b6b;display:inline-block}
.feed>svg{display:block;width:100%;height:auto}
.feed-foot{font-size:11.5px;color:#8ea2b9;padding:5px 9px;line-height:1.35}
.cam-hit{fill:transparent;stroke:transparent;cursor:pointer}
.cam-hit:hover{stroke:#fff;stroke-dasharray:3 3;stroke-width:1.2}
.cam-reading{animation:dash .8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}

.wb-surface{margin:16px;border:2px solid #cfd5dc;border-radius:6px;background:#fdfdfc;padding:14px 20px;font-family:Kalam,"Marker Felt","Segoe Print","Bradley Hand","Chalkboard SE","Comic Sans MS",cursive;color:#1f3c8f}
.wb-line{display:flex;align-items:baseline;gap:16px;padding:10px 0;border-bottom:1px dashed #e1e5ea;flex-wrap:wrap}
.wb-line:last-child{border-bottom:0}
.wb-label{width:140px;font-size:22px;color:#222}
.wb-val{font-size:36px;min-width:48px}
.wb-tally{font-size:30px;letter-spacing:.03em;word-break:break-word}
.wb-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:0 16px 14px}
.wb-tools .muted{margin-right:4px}
.bubble{margin:16px 16px 0;background:#f3f5f8;border-radius:10px;padding:10px 14px;font-size:15px}

.ov{position:fixed;inset:0;background:rgba(18,24,33,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.ov.int{z-index:60;background:rgba(18,24,33,.66)}
.dlg{background:#fff;border-radius:12px;max-width:560px;width:100%;max-height:calc(100vh - 40px);overflow:auto;padding:20px 22px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.dlg.wide{max-width:860px}
.dlg h2{font-size:20px}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start;margin:8px 0}
.cmp .mini-log{margin:0}
.pick{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0}
.pick button{justify-content:space-between;min-height:44px;text-align:left}
.pick button b{font-variant-numeric:tabular-nums}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:600;margin:10px 0 4px}
.result{border-radius:10px;padding:12px 14px;margin:10px 0;font-weight:550;display:flex;gap:8px;align-items:flex-start}
.result.ok{background:var(--ok-bg);color:var(--ok-text);border:1px solid var(--ok-line)}
.result.bad{background:var(--bad-bg);color:var(--bad-text);border:1px solid var(--bad-line)}
.result .ico{flex:none;margin-top:2px}
.mini-log{border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:8px 0}
.mini-log .row{font-size:14px}
.mini-log .row:last-child{border-bottom:0}
.err{color:var(--bad-text);font-size:14px;min-height:20px;margin:4px 0 0}

.int-dlg{max-width:640px;border-top:6px solid var(--int)}
.int-who{font-size:14px;font-weight:700;color:var(--int-text);margin:0}
.int-text{font-size:23px;font-weight:650;margin:6px 0 16px;line-height:1.3}
.bar{height:10px;background:#eef1f5;border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;background:var(--int);transition-property:width;transition-timing-function:linear}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.opts button{min-height:66px;line-height:1.25}
.shake{animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:#1d2430;color:#fff;padding:10px 16px;border-radius:10px;font-weight:550;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:70;max-width:90vw;display:flex;align-items:center;gap:14px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.show.act{pointer-events:auto}
.toast button{min-height:30px;padding:3px 12px;background:transparent;border-color:#6b7a90;color:#ffd98a;font-weight:650}
.toast button:hover{background:#2b3546}
.toast button[hidden]{display:none}

.screen{display:flex;justify-content:center;padding:36px 20px 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px 32px;max-width:760px;width:100%}
.card.wide{max-width:1040px}
.eyebrow{font-size:12px;font-weight:700;color:var(--accent-text);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px}
.steps{padding-left:22px;margin:12px 0 14px}
.steps li{margin:7px 0}
.callout{background:#fff4ec;border:1px solid #f4c9a8;border-radius:10px;padding:12px 14px;margin:14px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;background:#0f1721;color:#e8eef5;border-radius:10px;padding:10px 14px;margin:12px 0;font-size:14px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.lg{width:26px;height:17px;border-radius:3px;display:inline-block;background:#f6f3ea;flex:none}
.lg.g{outline:2px solid var(--d-green);outline-offset:2px}
.lg.a{outline:2px solid var(--d-amber);outline-offset:2px}
.go{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}
fieldset{border:1px solid var(--line);border-radius:10px;padding:8px 14px 10px;margin:14px 0}
legend{font-weight:650;padding:0 6px}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:end;padding:10px 0;border-top:1px solid var(--line)}
.lk:first-of-type{border-top:0}
.lk b{display:block;margin-bottom:5px}
.lk input{font-size:13px;color:var(--muted);min-height:38px}
.lk button{min-height:38px}
.lk-note{display:block;font-style:normal;font-size:13px;color:var(--muted);margin:-2px 0 6px}
.spare{margin:14px 0 4px}
.spare summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
.spare .lk:first-of-type{border-top:0}
.saved{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.saved button{min-height:32px;padding:4px 10px;font-size:13px}
.q{margin:20px 0}
.q-t{font-weight:650;margin:0 0 8px}
.q-opts{display:flex;flex-wrap:wrap;gap:8px}
.q-opts label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:8px;padding:8px 12px;cursor:pointer;background:#fff}
.q-opts label:has(input:checked){border-color:var(--accent);background:var(--accent-bg)}
.q-opts input{margin:0}
.sus{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sus-row{display:grid;grid-template-columns:minmax(0,1fr) repeat(5,56px);align-items:center;border-top:1px solid var(--line);padding:0 6px 0 14px}
.sus-row:first-child{border-top:0}
.sus-row.missing{background:var(--bad-bg)}
.sus-head{background:#f6f7f9;font-size:12px;color:var(--muted);font-weight:600;padding-top:8px;padding-bottom:8px}
.sus-head span{text-align:center;line-height:1.2}
.sus-t{padding:10px 12px 10px 0;font-size:15px}
.sus-c{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:8px 0;cursor:pointer;font-size:12px;color:var(--muted);border-radius:6px}
.sus-c:hover{background:#eef3fc}
.sus-c input{margin:0;width:18px;height:18px}
.res-actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.res-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-top:16px}
.res-sec{border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.res-sec h3{font-size:12px;margin:0 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:5px 0;border-bottom:1px dashed #e6e9ee;font-size:14px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted);flex:1 1 auto;min-width:0}
.kv b{font-weight:650;text-align:right;flex:0 0 auto;max-width:58%}
.kv b.good{color:var(--ok-text)}
.kv b.badv{color:var(--bad-text)}
.facd{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.facd>summary{color:var(--muted)}
details{margin-top:16px}
summary{cursor:pointer;font-weight:600}
.logtable{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}
.logtable td,.logtable th{padding:4px 6px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}
.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:6px 20px;background:#fdf1d3;color:#5b4300;border-bottom:1px solid #e9cf8a;font-size:13px}
.demobar b{font-weight:700}
.demo-acts{display:flex;gap:6px;flex-wrap:wrap}
.demobar button{min-height:30px;padding:3px 10px;font-size:13px;background:#fffaf0;border-color:#d9bd72;color:#5b4300;white-space:nowrap}
.demobar button:hover{background:#fff}
.demo-box{margin-top:16px;padding:14px 16px;border:1px dashed var(--line2);border-radius:10px;display:flex;flex-direction:column;gap:12px}
.demo-box p{margin:3px 0 0}
.demo-btns{display:flex;gap:8px;flex-wrap:wrap}
.demo-btns button{white-space:nowrap}
.foot{text-align:center;padding:6px 0 18px}
.foot button{min-height:auto;padding:4px 10px;font-size:12px;color:var(--faint)}
@media (max-width:1100px){.b-main{grid-template-columns:300px minmax(0,1fr)}}
@media (max-width:1000px){.work{grid-template-columns:1fr}.b-main{grid-template-columns:1fr}.big-num{font-size:84px}.cmp{grid-template-columns:1fr}}
@media (max-width:560px){.opts{grid-template-columns:1fr 1fr}.cart{grid-template-columns:1fr}.card{padding:22px 18px}.lk{grid-template-columns:1fr 1fr}.lk>div{grid-column:1/-1}}
@media (max-height:820px) and (min-width:1001px){.rq-done{display:none}.rq-text{font-size:17px;margin:3px 0 6px}.cart{gap:5px}.pk{min-height:46px}.pk-body{padding:4px 10px;gap:3px}.work .col:first-child>.panel{padding:9px 13px}}
@media (prefers-reduced-motion:reduce){.cam-reading,.dark .pend.late,.askpk{animation:none}}

/* ---------- metrics and results ---------- */
function computeMetrics() {
  var M = {}, sc = SCEN[S.scen];
  var reqAt = S.count.requested ? S.count.requestAt : Infinity;
  M.caseSeconds = S.t0 ? ((S.caseEnd || now()) - S.t0) / 1000 : 0;
  M.truth = truthNeedles();
  M.packets = S.packets.length;
  M.openedNeedles = M.truth - S.initial;
  M.wrongItems = S.log.filter(function (l) { return l.type === 'wrong_item_opened'; }).length;
  M.requestMedian = median(S.steps.map(function (r) { return r && r.doneAt ? (r.doneAt - r.shownAt) / 1000 : null; }));
  M.boardAtCount = S.count.boardAtRequest;
  M.pendAtCount = S.count.pendingAtRequest;
  M.discAtCount = S.count.requested ? S.count.scrub - S.count.boardAtRequest : null;
  var intP = S.packets.filter(function (p) { return p.id === S.flags.intPacket; })[0];
  if (S.mode === 'whiteboard') {
    M.recorded = S.initial + tallySum(S);
    M.pendingEnd = 0;
    var daOpened = S.packets.filter(function (p) { return ITEMS[p.itemId].da; }).length;
    var plus2 = S.tallies.filter(function (t) { return t.n === 2; }).length;
    M.daAs2 = Math.min(daOpened, plus2) + ' of ' + daOpened;
    var lat = [];
    S.packets.forEach(function (p, i) { var t = S.tallies[i]; if (t) lat.push(Math.max(0, (t.at - p.openedAt) / 1000)); });
    M.latency = median(lat);
    M.intRecorded = !intP ? 'not reached' : (S.flags.intChecked ? (S.flags.intRecovered ? 'yes' : 'no') : 'unclear');
  } else {
    var R = reconcile();
    M.recorded = S.initial + confirmedSum(S);
    M.pendingEnd = pendingSum(S);
    M.unrecorded = S.packets.filter(function (p) { return !R.linked[p.id]; }).map(function (p) { return ITEMS[p.itemId].name; });
    M.extra = R.extra.length;
    M.wrongQty = S.packets.filter(function (p) { var e = R.linked[p.id]; return e && e.needles !== p.n; }).length;
    var lat2 = [];
    S.packets.forEach(function (p) { var e = R.linked[p.id]; if (e) lat2.push(Math.max(0, ((e.confirmedAt || e.createdAt) - p.openedAt) / 1000)); });
    M.latency = median(lat2);
    if (intP) {
      var ie = R.linked[intP.id];
      var ieAt = ie ? (ie.confirmedAt || ie.createdAt) : null;
      M.intRecorded = ie ? (ieAt <= reqAt ? 'yes' : 'only after the count was called') : 'no';
      M.intReturn = ie && S.flags.intEndedAt ? Math.max(0, (ieAt - S.flags.intEndedAt) / 1000) : null;
    } else {
      M.intRecorded = 'not reached';
    }
    if (!sc.practice) {
      var mp = S.packets.filter(function (p) { return p.kind === 'misread'; })[0];
      var ms = S.entries.filter(function (e) { return e.misread; })[0];
      if (!mp || !ms) M.misread = 'not reached';
      else {
        var ml = R.linked[mp.id], mok = ml && ml.needles === mp.n;
        if (mok && ml === ms && ms.fixed) M.misread = 'caught at the suggestion';
        else if (mok && ms.status === 'rejected') M.misread = 'caught at the suggestion (rejected, then added)';
        else if (mok) M.misread = (ml.editedAt || ml.confirmedAt || ml.createdAt) <= reqAt ? 'confirmed wrong, corrected before the count' : 'confirmed wrong, corrected during the count check';
        else if (ms.status === 'pending') M.misread = 'left pending';
        else M.misread = 'not caught (wrong count stayed on the board)';
      }
      var xp = S.packets.filter(function (p) { return p.kind === 'miss'; })[0];
      if (!xp) M.miss = 'not reached';
      else {
        var xl = R.linked[xp.id];
        M.miss = !xl ? 'not caught' : ((xl.confirmedAt || xl.createdAt) <= reqAt ? 'caught before the count' : 'caught during the count check');
        M.missVia = xl ? (xl.fromFeed ? 'camera view' : 'Add manually') : null;
      }
      var up = S.packets.filter(function (p) { return p.kind === 'unreadable'; })[0];
      var us = S.entries.filter(function (e) { return e.wasUnreadable; })[0];
      if (!up || !us) M.unread = 'not reached';
      else if (us.status === 'pending') M.unread = 'left unidentified';
      else if (us.status === 'confirmed') M.unread = us.needles === up.n ? 'identified correctly' : 'identified wrong (wrong needle count)';
      else { var ul = R.linked[up.id]; M.unread = ul && ul.needles === up.n ? 'dismissed, then added correctly' : 'dismissed (not counted)'; }
    }
    var camE = S.entries.filter(function (e) { return e.source === 'camera'; });
    M.confirmMedian = median(camE.filter(function (e) { return e.confirmedAt && !e.wasUnreadable; }).map(function (e) { return (e.confirmedAt - e.createdAt) / 1000; }));
    var waits = camE.map(function (e) { return ((e.confirmedAt || e.rejectedAt || S.caseEnd || now()) - e.createdAt) / 1000; });
    M.longestWait = waits.length ? Math.max.apply(null, waits) : null;
    M.rejected = camE.filter(function (e) { return e.status === 'rejected'; }).length;
    M.undos = S.log.filter(function (l) { return l.type === 'undo'; }).length;
  }
  M.boardMatchesField = M.recorded === M.truth;
  var a = S.count.attempts;
  if (S.mode === 'whiteboard') {
    M.countFirst = !a.length ? 'not done' : (a[0].saysMatch ? 'said it matched' : 'said it didn’t match') + (a[0].saysMatch === a[0].actualMatch ? ' (correct)' : ' (incorrect)');
    M.countResolved = S.count.skipped ? 'skipped' : (S.count.saidMatch ? (S.count.resolved ? 'yes' : 'said it matched, but it didn’t') : 'no');
  } else {
    M.countFirst = !a.length ? 'not done' : (a[0].match ? 'matched' : 'mismatch (board ' + a[0].expected + ', counted ' + a[0].counted + ')');
    M.countResolved = S.count.resolved ? 'yes' : (S.count.skipped ? 'skipped' : 'no');
  }
  M.countAttempts = a.length;
  M.countTime = S.count.requested && S.caseEnd ? (S.caseEnd - S.count.requestAt) / 1000 : null;
  if (!sc.practice) {
    M.reviewSeconds = S.handoffReviewed ? (S.handoffReviewed - S.handoffStart) / 1000 : null;
    if (HANDOFF) M.probe = probeList().map(function (q) {
      var ans = S.probe[q.key];
      var label = ans === undefined || ans === '' ? 'no answer' : (q.options ? (q.options.filter(function (o) { return o[0] === ans; })[0] || [ans, ans])[1] : ans);
      return { key: q.key, text: q.text, raw: ans, answer: label, correct: q.truth ? String(ans) === q.truth : null };
    });
    M.probeScore = M.probe ? M.probe.filter(function (p) { return p.correct === true; }).length : null;
    M.seq = S.survey.seq || null;
    M.demand = S.survey.demand || null;
    M.sus = susScore();
    M.susItems = SUS.map(function (t, i) { return S.survey['sus' + (i + 1)] || '-'; });
    M.trust = S.survey.trust || null;
    M.aware = S.survey.aware || null;
    M.comfort = S.survey.comfort || null;
  }
  return M;
}

}

    var t = now(), away = !!(S.interrupt || S.modal);

  e.status = 'pending';
  e.confirmedAt = null;
  e.rejectedAt = null;
  clearToast();
  renderMain();
}
function fixEntry(id, n) {
  var d = activeData(), e = findEntry(d, id);
  if (!e) return;
  var item = e.trueItem || e.itemId, wasUnread = !!e.unreadable;
  log(wasUnread ? 'camera_identified' : 'camera_fixed', { true_item: e.trueItem, from_needles: e.needles === null ? 'unknown' : e.needles, to_needles: n, kind: wasUnread ? 'unreadable' : (e.misread ? 'misread' : 'ok') });
  e.itemId = item;
  e.name = nameFor(item, n);
  e.needles = n;
  e.status = 'confirmed';
  e.confirmedAt = now();
  e.order = ++orderSeq;
  if (wasUnread) { e.unreadable = false; e.identified = true; } else { e.fixed = true; }
  S.modal = null;
  toast((wasUnread ? 'Added: +' : 'Fixed: +') + needlesWord(n));
  renderModal();
  renderMain();
}
function addManual(n, pid) {
  var d = activeData(), t = now();
  var pk = pid != null ? d.packets.filter(function (x) { return x.id === pid; })[0] : null;
  var itemId = pk ? pk.itemId : null;
  var it = { name: nameFor(itemId, n), n: n };
  var e = { id: ++S.seq, itemId: itemId, name: it.name, needles: n, source: 'manual', status: 'confirmed', createdAt: t, confirmedAt: t, simTime: S.phase === 'handoff' ? d.clock : fmt(simMin()), packetId: pid != null ? pid : null, fromFeed: pid != null, order: ++orderSeq };
  d.entries.push(e);
  log('manual_add', { item: itemId || 'unnamed', needles: n, via: pid != null ? 'camera view' : 'button' });
  toast('Added: +' + needlesWord(n));
  var fromCount = S.modal && S.modal.from === 'count';
  S.modal = null;
  renderModal();
  renderMain();
  if (fromCount) doCount();
}
function editEntry(id, n) {
  var e = findEntry(S, id);
  if (!e) return;
  var it = { name: nameFor(e.itemId, n), n: n };
  log('entry_edited', { from_needles: e.needles, to_needles: n, source: e.source });
  e.name = it.name;
  e.needles = n;
  e.edited = true;
  e.editedAt = now();
  var fromCount = S.modal && S.modal.from === 'count';
  S.modal = null;
  toast('Entry updated: ' + it.name + ', ×' + it.n);
  renderModal();
  renderMain();
  if (fromCount) doCount();
}
function removeEntry(id) {
  var e = findEntry(S, id);
  if (!e) return;
  e.status = 'deleted';
  e.deletedAt = now();
  log('entry_removed', { item: e.itemId, needles: e.needles, source: e.source });
  var fromCount = S.modal && S.modal.from === 'count';
  S.modal = null;
  toast('Entry removed');
  renderModal();
  renderMain();
  if (fromCount) doCount();
}
function wbAdd(n) {
  S.tallies.push({ n: n, at: now() });
  log('whiteboard_add', { needles: n });
  renderMain();
}
function wbErase() {
  if (!S.tallies.length) return;
  var t = S.tallies.pop();
  log('whiteboard_erase', { needles: t.n });
  renderMain();
}
function checkIntRecovery(p) {
  if (S.mode !== 'whiteboard' || !S.flags.intEndedAt || S.flags.intChecked) return;
  var before = S.packets.filter(function (x) { return x !== p; });
  var needed = before.reduce(function (a, x) { return a + x.n; }, 0);
  S.flags.intRecovered = tallySum(S) >= needed;
  S.flags.intChecked = true;
}
function startInterrupt() {
  var cfg = SCEN[S.scen].interrupt;
  S.hand = null;
  S.modal = null;
  renderModal();
  clearToast();
  S.interrupt = { stage: 'walk', startAt: now(), wrong: 0, cfg: cfg };
  log('interruption_start', { from: cfg.who });
  renderInterrupt();
  var tk = S.token;
  clearTimeout(intTimer);
  intTimer = setTimeout(function () {
    if (!S || S.token !== tk || !S.interrupt) return;
    intDone();
    toast('You’re back at the board.');
  }, 5200);
}
function intDone() {
  var I = S.interrupt;
  if (!I) return;
  log('interruption_end', { seconds: Math.round((now() - I.startAt) / 100) / 10 });
  S.flags.intEndedAt = now();
  S.interrupt = null;
  renderInterrupt();
  renderMain();
}
function openCount() {
  log('count_check_opened');
  if (S.mode === 'camera' && S.count.requested) { doCount(); return; }
  S.modal = { type: 'count' };
  renderModal();
}
function doCount() {
  var v = S.count.scrub;
  var expected = S.initial + confirmedSum(S), pend = pendingSum(S);
  var match = v === expected;
  S.count.attempts.push({ at: now(), counted: v, expected: expected, pending: pend, match: match });
  log('count_check', { counted: v, board_expected: expected, pending: pend, match: match });
  if (match) {
    S.count.resolved = true;
    S.count.resolvedAt = now();
    S.lastMatch = fmt(simMin());
    S.lastMatchNote = 'count check';
    S.lastMatchAt = now();
  }
  S.count.last = { counted: v, expected: expected, pend: pend, match: match };
  S.modal = { type: 'count', result: S.count.last };
  renderModal();
  renderMain();
}
function wbCount(says) {
  var board = S.initial + tallySum(S);
  var actual = board === S.count.scrub;
  S.count.attempts.push({ at: now(), saysMatch: says, actualMatch: actual, board: board, counted: S.count.scrub });
  log('whiteboard_count_judgment', { says_match: says, board_total: board, scrub_count: S.count.scrub, actually_matches: actual });
  if (says) {
    S.count.saidMatch = true;
    S.count.resolved = actual;
    S.modal = null;
    renderModal();
    endCase();
  } else {
    S.modal = { type: 'count', result: 'no' };
    renderModal();
  }
}
function skipCount() {
  S.count.skipped = true;
  log('count_skipped');
  S.modal = null;
  renderModal();
  endCase();
}
function endCase() {
  if (S.phase !== 'case') return;
  S.caseEnd = now();
  S.hand = null;
  S.interrupt = null;
  log('case_end', { board_total: boardTotal(), actual: truthNeedles() });
  S.phase = SCEN[S.scen].practice ? 'practiceDone' : (HANDOFF ? 'handoffIntro' : (S.demo ? 'results' : 'survey'));
  S.modal = null;
  render();
  window.scrollTo(0, 0);
}
function handoffData(mode) {
  var H = handoffDef();
  var d = { room: H.room, from: H.from, clock: H.clock, initial: H.initial, lastMatch: H.lastMatch, sponges: H.sponges, instruments: H.instruments };
  var t = now() - 600000;
  d.entries = H.entries.map(function (x, i) {
    var it = ITEMS[x.itemId];
    var pending = mode === 'camera' && x.pending;
    return { id: 'h' + i, itemId: x.itemId, trueItem: x.itemId, name: it.name, needles: it.n, source: x.source || 'camera', status: pending ? 'pending' : 'confirmed', createdAt: t, confirmedAt: pending ? null : t, simTime: x.time, conf: 'High', order: i + 1 };
  });
  d.packets = H.entries.map(function (x, i) { return { id: 100 + i * 3, itemId: x.itemId, n: ITEMS[x.itemId].n, entryId: 'h' + i, kind: 'ok' }; });
  d.tallies = H.entries.map(function (x) { return { n: ITEMS[x.itemId].n }; });
  return d;
}
function startHandoff() {
  S.hd = handoffData(S.mode);
  S.phase = 'handoff';
  S.handoffStart = now();
  orderSeq = 100;
  log('handoff_start', { room: S.hd.room });
  S.modal = null;
  render();
  window.scrollTo(0, 0);
}
function reviewed() {
  S.handoffReviewed = now();
  log('handoff_reviewed', { seconds: Math.round((S.handoffReviewed - S.handoffStart) / 100) / 10, pending_left: S.mode === 'camera' ? pendingList(S.hd).length : 0 });
  S.phase = 'probe';
  render();
  window.scrollTo(0, 0);
}
function submitProbe() {
  var ok = true, firstBad = null;
  probeList().forEach(function (q) {
    var errEl = $('err_' + q.key), v = S.probe[q.key], msg = '';
    if (q.type === 'number') {
      if (v === undefined || !/^\d{1,2}$/.test(String(v).trim())) msg = 'Enter a number, even if it’s a guess.';
    } else if (!v) {
      msg = 'Choose an answer. “Not sure” is fine.';
    }
    if (errEl) errEl.textContent = msg;
    if (msg) { ok = false; if (!firstBad) firstBad = q.key; }
  });
  if (!ok) {
    var el = document.querySelector('[data-q="' + firstBad + '"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  S.probe.needles = String(parseInt(S.probe.needles, 10));
  log('probe_submitted', { needles: S.probe.needles, waiting: S.probe.waiting, double_armed: S.probe.da, check_first: S.probe.check, confidence: S.probe.conf });
  S.phase = S.demo ? 'results' : 'survey';
  render();
  window.scrollTo(0, 0);
}

/* ---------- copy helpers ---------- */
function fallbackCopy(text) {
  var ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.position = 'fixed';
  ta.style.top = '-1000px';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { }
  document.body.removeChild(ta);
  return ok;
}
function copyText(text, okMsg) {
  function done(ok) { toast(ok ? okMsg : 'Couldn’t copy automatically. Take a screenshot instead.'); }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(fallbackCopy(text)); });
  } else {
    done(fallbackCopy(text));
  }
}
function backToSetup() {
  if (!S.demo) setupVals.pid = S.pid;
  S = null;
  clearInterval(clockTimer);
  history.replaceState(null, '', location.pathname);
  render();
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
var ACT = {
  demo: function (el) {
    var mode = el.getAttribute('data-mode');
    if (S) { S.modal = null; S.interrupt = null; } else readSetup();
    clearInterval(clockTimer);
    newRun('', mode, 's1', true);
    history.replaceState(null, '', location.pathname + '?demo=' + mode);
    render();
    window.scrollTo(0, 0);
  },
  demoexit: function () { backToSetup(); },
  openrun: function (el) {
    readSetup();
    newRun(setupVals.pid, el.getAttribute('data-mode'), el.getAttribute('data-scen'));
    render();
    window.scrollTo(0, 0);
  },
  copylink: function (el) { updateLinks(); copyText(runLink(el.getAttribute('data-mode'), el.getAttribute('data-scen')), 'Link copied. Paste it into the meeting chat.'); },
  copyall: function () { copyText(savedRuns().map(function (r) { return r.text; }).join('\n\n----------\n\n'), 'All saved results copied.'); },
  clearall: function () {
    if (window.confirm('Clear all results saved in this browser?')) {
      try { localStorage.removeItem('ncbRuns'); } catch (e) { }
      renderMain();
    }
  },
  start: function () { startCase(); },
  pick: function (el) { pick(el.getAttribute('data-item')); },
  confirm: function (el) { confirmEntry(el.getAttribute('data-id')); },
  reject: function (el) { rejectEntry(el.getAttribute('data-id')); if (S.modal) { S.modal = null; renderModal(); } },
  undo: function () { undoLast(); },
  fix: function (el) { S.modal = { type: 'fix', id: el.getAttribute('data-id') }; log('camera_fix_opened'); renderModal(); },
  fixpick: function (el) { fixEntry(S.modal.id, +el.getAttribute('data-n')); },
  add: function () {
    var from = S.modal && S.modal.type === 'count' ? 'count' : null;
    S.modal = { type: 'add', from: from };
    log('manual_add_opened', { via: 'button' });
    renderModal();
  },
  feedadd: function (el) {
    var from = S.modal && S.modal.type === 'count' ? 'count' : null;
    S.modal = { type: 'add', from: from, pid: +el.getAttribute('data-pid') };
    log('manual_add_opened', { via: 'camera view' });
    renderModal();
  },
  addpick: function (el) { addManual(+el.getAttribute('data-n'), S.modal ? S.modal.pid : null); },
  editrow: function (el) {
    S.modal = { type: 'edit', id: el.getAttribute('data-id'), from: el.getAttribute('data-from') || null };
    log('edit_opened');
    renderModal();
  },
  editpick: function (el) { editEntry(S.modal.id, +el.getAttribute('data-n')); },
  removeentry: function () { removeEntry(S.modal.id); },
  summary: function () { S.modal = { type: 'summary' }; log('handoff_summary_opened'); renderModal(); },
  close: function () { S.modal = null; renderModal(); },
  count: function () { openCount(); },
  countgo: function () { doCount(); },
  countagain: function () { doCount(); },
  countback: function () { S.modal = { type: 'count', result: S.count.last }; renderModal(); },
  countyes: function () { wbCount(true); },
  countno: function () { wbCount(false); },
  countskip: function () { skipCount(); },
  countdone: function () { S.modal = null; renderModal(); endCase(); },
  wb: function (el) { wbAdd(+el.getAttribute('data-n')); },
  wberase: function () { wbErase(); },
  handoffgo: function () { startHandoff(); },
  reviewed: function () { reviewed(); },
  probesubmit: function () { submitProbe(); },
  surveysubmit: function () { submitSurvey(); },
  copyres: function () { copyText(resultsText(), 'Results copied. Paste them into the meeting chat.'); },
  copyrow: function () { copyText(sheetRow(computeMetrics()), 'Row copied. Paste it into your spreadsheet.'); },
  newrun: function () { backToSetup(); },
  fac: function () { if (!S) return; S.modal = { type: 'fac' }; renderModal(); },
  facskipcount: function () {
    S.modal = null; renderModal();
    log('facilitator_skip_to_count');
    S.steps.forEach(function (r) { if (r) r.done = true; });
    requestCount();
  },
  facend: function () { S.modal = null; log('facilitator_end_case'); endCase(); },
  facresults: function () {
    log('facilitator_jump_to_results');
    if (S.phase === 'case') { S.caseEnd = now(); }
    S.modal = null; S.interrupt = null; S.phase = 'results'; render();
  },
  facrestart: function () {
    var pid = S.pid, mode = S.mode, scen = S.scen, demo = S.demo;
    newRun(pid, mode, scen, demo);
    clearInterval(clockTimer);
    render();
  },
  facsetup: function () { backToSetup(); }
};
document.addEventListener('click', function (ev) {
  var el = ev.target.closest ? ev.target.closest('[data-act]') : null;
  if (!el) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) fn(el, ev);
});
function onAnswer(t) {
  if (!t.getAttribute) return;
  if (S && S.phase === 'probe' && t.getAttribute('data-q')) {
    S.probe[t.getAttribute('data-q')] = t.value;
    var err = $('err_' + t.getAttribute('data-q'));
    if (err) err.textContent = '';
  }
  if (S && S.phase === 'survey' && t.getAttribute('data-s')) {
    var key = t.getAttribute('data-s');
    S.survey[key] = t.value;
    var e1 = $('serr_' + key);
    if (e1) e1.textContent = '';
    var row = $('row_' + key);
    if (row) row.classList.remove('missing');
    ['sus', 'cam'].forEach(function (g) {
      var box = $('serr_' + g);
      if (box && !box.parentNode.querySelector('.sus-row.missing')) box.textContent = '';
    });
  }
}
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (!S && t.id === 'sPid') updateLinks();
  onAnswer(t);
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  onAnswer(t);
});
document.addEventListener('keydown', function (ev) {
  if (!S) return;
  if (ev.key === 'Enter' && S.modal && S.modal.type === 'count' && ev.target && ev.target.id === 'countIn') {
    ev.preventDefault();
    doCount();
  }
  if (ev.key === 'Escape' && S.modal && !S.interrupt && ['add', 'fix', 'fac', 'summary', 'edit'].indexOf(S.modal.type) >= 0) {
    S.modal = (S.modal.type === 'add' || S.modal.type === 'edit') && S.modal.from === 'count' ? { type: 'count' } : null;
    renderModal();
  }
  if (ev.key === 'F' && ev.shiftKey && ev.altKey) { S.modal = { type: 'fac' }; renderModal(); }
});
window.addEventListener('beforeunload', function (ev) {
  if (S && !S.demo && ['case', 'handoff', 'probe', 'survey'].indexOf(S.phase) >= 0) { ev.preventDefault(); ev.returnValue = ''; }
});

/* ---------- boot ---------- */
(function boot() {
  var q = new URLSearchParams(location.search);
  var mode = q.get('mode'), scen = SCEN_PARAM[q.get('scenario') || ''], pid = q.get('pid') || '';
  setupVals.pid = pid;
  if (MODES[q.get('demo')]) newRun('', q.get('demo'), 's1', true);
  else if (MODES[mode] && scen) newRun(pid, mode, scen);
  render();
})();
})();
</script>
</body>
